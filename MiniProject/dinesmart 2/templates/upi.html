<!-- templates/upi.html -->
{% extends "base.html" %}
{% block title %}UPI Payment - DineSmart{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card glass-effect-3d" style="text-align: center;">
        <div class="auth-header">
            <div class="auth-icon">📱</div>
            <h2>Scan & Pay</h2>
            <p>Total Amount: <strong style="color: #ffd700; font-size: 1.5rem;">₹{{ total }}</strong></p>
        </div>
        
        <div class="qr-container">
            <div class="qr-placeholder">
                <div class="qr-icon">📱</div>
                <p style="margin-top: 10px;">UPI QR Code</p>
                <small style="color: #ffd700;">UPI ID: dinesmart@okhdfcbank</small>
            </div>
        </div>
        
        <p class="payment-instruction">Scan using any UPI app (Google Pay, PhonePe, Paytm)</p>
        
        <form action="{{ url_for('feedback') }}" method="GET">
            <button type="submit" class="btn-auth">
                <span>✓ Payment Completed</span>
                <i class="fas fa-check"></i>
            </button>
        </form>
        
        <a href="{{ url_for('bill') }}" style="display: inline-block; margin-top: 20px; color: #ffd700; text-decoration: none;">← Back to Bill</a>
    </div>
</div>

<style>
.qr-container {
    display: flex;
    justify-content: center;
    margin: 30px 0;
}
.qr-placeholder {
    width: 220px;
    height: 220px;
    background: linear-gradient(135deg, #fff, #f0f0f0);
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 3px solid #ffd700;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.qr-icon {
    font-size: 80px;
}
.payment-instruction {
    color: rgba(255, 255, 255, 0.8);
    margin: 20px 0;
}
</style>
{% endblock %}
